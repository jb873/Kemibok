  <circle cx="616" cy="130" r="24" fill="#3D6BA8" stroke="#fff" stroke-width="1.5"/>
  <text x="616" y="137.68" fill="#fff" font-size="21.6" font-weight="bold" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">OH<tspan font-size="0.7em" dy="-0.6em">−</tspan></text>
  <text x="550" y="200" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic">två hydroxidjoner</text>
