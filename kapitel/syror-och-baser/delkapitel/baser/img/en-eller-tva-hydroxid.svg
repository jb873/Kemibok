<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-labelledby="t">
  <title id="t">Två halvor. Till vänster natriumhydroxid som delas i en violett natriumjon och en blå hydroxidjon. Till höger kalciumhydroxid som delas i en orange kalciumjon och två blå hydroxidjoner</title>
  <line x1="380" y1="20" x2="380" y2="230" stroke="#2d4a35" stroke-width="2"/>
