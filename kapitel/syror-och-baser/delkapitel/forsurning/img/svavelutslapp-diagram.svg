  <title id="t">Diagram över svavelnedfallet över Sverige 1980–2020: kurvan börjar högt vid 1980, faller brant till omkring 2000 och planar ut nära en streckad linje för förindustriell nivå</title>
  <line x1="130" y1="30" x2="130" y2="300" stroke="#2d4a35" stroke-width="2"/>
