  <text x="482.5" y="326" fill="#2d4a35" font-size="16" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">2010</text>
  <line x1="600" y1="300" x2="600" y2="306" stroke="#2d4a35" stroke-width="2"/>
  <text x="600" y="326" fill="#2d4a35" font-size="16" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">2020</text>
  <line x1="124" y1="40" x2="130" y2="40" stroke="#2d4a35" stroke-width="2"/>
  <text x="118" y="45" fill="#2d4a35"  font-family="Georgia, 'Times New Roman', serif" text-anchor="end" font-size="13">1980 års nivå</text>
  <text transform="translate(30 170) rotate(-90)" text-anchor="middle" fill="#2d4a35" font-size="16" font-family="Georgia, 'Times New Roman', serif" font-style="italic">Svavelnedfall</text>
