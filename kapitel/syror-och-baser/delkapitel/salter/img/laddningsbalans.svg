  <text x="390" y="140" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic">+2 och två gånger −1</text>
  <text x="390" y="178" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="bold">CaCl<tspan font-size="0.7em" dy="0.35em">2</tspan></text>
  <circle cx="534" cy="78" r="24" fill="#7d8fa8" stroke="#fff" stroke-width="1.5"/>
  <text x="534" y="85.68" fill="#fff" font-size="21.6" font-weight="bold" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">Al<tspan font-size="0.7em" dy="-0.6em">3+</tspan></text>
  <circle cx="592" cy="78" r="24" fill="#7d8fa8" stroke="#fff" stroke-width="1.5"/>
  <text x="592" y="85.68" fill="#fff" font-size="21.6" font-weight="bold" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">Al<tspan font-size="0.7em" dy="-0.6em">3+</tspan></text>
  <circle cx="650" cy="78" r="24" fill="#C0392B" stroke="#fff" stroke-width="1.5"/>
  <text x="650" y="85.68" fill="#fff" font-size="21.6" font-weight="bold" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">O<tspan font-size="0.7em" dy="-0.6em">2−</tspan></text>
  <circle cx="708" cy="78" r="24" fill="#C0392B" stroke="#fff" stroke-width="1.5"/>
  <text x="708" y="85.68" fill="#fff" font-size="21.6" font-weight="bold" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">O<tspan font-size="0.7em" dy="-0.6em">2−</tspan></text>
  <circle cx="766" cy="78" r="24" fill="#C0392B" stroke="#fff" stroke-width="1.5"/>
  <text x="766" y="85.68" fill="#fff" font-size="21.6" font-weight="bold" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">O<tspan font-size="0.7em" dy="-0.6em">2−</tspan></text>
  <text x="650" y="140" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic">två gånger +3 och tre gånger −2</text>
  <text x="650" y="178" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="bold">Al<tspan font-size="0.7em" dy="0.35em">2</tspan><tspan dy="-0.35em">O</tspan><tspan font-size="0.7em" dy="0.35em">3</tspan></text>
  <line x1="40" y1="212" x2="740" y2="212" stroke="#2d4a35" stroke-width="1"/>
  <text x="390" y="238" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic">Summan är alltid noll</text>
