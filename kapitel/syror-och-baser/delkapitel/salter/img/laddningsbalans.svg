  <text x="332" y="85.68" fill="#fff" font-size="21.6" font-weight="bold" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">Ca<tspan font-size="0.7em" dy="-0.6em">2+</tspan></text>
  <circle cx="390" cy="78" r="24" fill="#6a9e4f" stroke="#fff" stroke-width="1.5"/>
  <text x="390" y="85.68" fill="#fff" font-size="21.6" font-weight="bold" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">Cl<tspan font-size="0.7em" dy="-0.6em">−</tspan></text>
  <circle cx="448" cy="78" r="24" fill="#6a9e4f" stroke="#fff" stroke-width="1.5"/>
