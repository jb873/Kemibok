<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" width="780" height="250" role="img" aria-labelledby="t">
  <title id="t">Tre exempel på laddningsbalans: natriumklorid, kalciumklorid och aluminiumoxid; under alla tre står att summan alltid är noll</title>
  <line x1="260" y1="20" x2="260" y2="200" stroke="#2d4a35" stroke-width="1"/>
  <line x1="520" y1="20" x2="520" y2="200" stroke="#2d4a35" stroke-width="1"/>
  <circle cx="101" cy="78" r="24" fill="#9b7cc4" stroke="#fff" stroke-width="1.5"/>
  <text x="101" y="85.68" fill="#fff" font-size="21.6" font-weight="bold" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">Na<tspan font-size="0.7em" dy="-0.6em">+</tspan></text>
  <circle cx="159" cy="78" r="24" fill="#6a9e4f" stroke="#fff" stroke-width="1.5"/>
  <text x="159" y="85.68" fill="#fff" font-size="21.6" font-weight="bold" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">Cl<tspan font-size="0.7em" dy="-0.6em">−</tspan></text>
  <text x="130" y="140" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic">+1 och −1</text>
  <text x="130" y="178" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="bold">NaCl</text>
