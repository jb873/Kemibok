  <line x1="425" y1="46" x2="425" y2="54" stroke="#2d4a35" stroke-width="1"/>
  <text x="425" y="40" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14">7</text>
  <line x1="498.75" y1="46" x2="498.75" y2="54" stroke="#2d4a35" stroke-width="1"/>
  <text x="498.75" y="40" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14">8</text>
  <line x1="572.5" y1="46" x2="572.5" y2="54" stroke="#2d4a35" stroke-width="1"/>
