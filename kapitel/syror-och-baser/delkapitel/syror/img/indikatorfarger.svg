<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t">
  <title id="t">Tre färgband över pH-skalan 3 till 11: lackmus är rött i surt och blått i basiskt, BTB gult i surt, grönt vid neutralt och blått i basiskt, rödkål rött och rosa i surt, lila vid neutralt och blått till grönt i basiskt</title>
