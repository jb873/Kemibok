  <text x="114" y="40" fill="#2d4a35"   font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic" text-anchor="end">pH</text>
  <rect x="130" y="60" width="590" height="44" rx="6" fill="url(#g0)" stroke="#2d4a35" stroke-width="1"/>
