      <stop offset="62.5%" stop-color="#3D6BA8"/>
      <stop offset="100%" stop-color="#3D6BA8"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#d4c04a"/>
