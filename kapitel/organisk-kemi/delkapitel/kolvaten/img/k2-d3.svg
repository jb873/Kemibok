<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 266" width="760" height="266" role="img" aria-labelledby="t">
  <title id="t">En tabell med fyra plaster. För varje plast står förkortningen, vilken monomer den tillverkas av, och vad den används till. PVC-raden är markerad och innehåller även klor</title>
  <text x="87.5" y="28"   text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic" fill="#5a9668" >Plast</text>
  <text x="225" y="28"   text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic" fill="#5a9668" >Förkortning</text>
  <text x="335" y="28"   text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic" fill="#5a9668" >Monomer</text>
  <text x="407" y="28"    font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic" fill="#5a9668" text-anchor="start">Används till</text>
  <line x1="16" y1="38" x2="744" y2="38" stroke="#2d4a35" stroke-width="1.4" stroke-linecap="round" />
  <text x="87.5" y="74" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" data-kolumn="plast" data-rad="1">Polyeten</text>
  <text x="225" y="74" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" data-kolumn="forkortning" data-rad="1">PE</text>
  <text x="335" y="74" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" data-kolumn="monomer" data-rad="1">eten</text>
  <text x="407" y="74" fill="#2d4a35"   font-family="Georgia, 'Times New Roman', serif" font-size="14" text-anchor="start" data-kolumn="anvands" data-rad="1">plastpåsar, flaskor, plastfilm, förpackningar</text>
  <line x1="16" y1="90" x2="744" y2="90" stroke="#2d4a35" stroke-width="0.8" stroke-linecap="round" />
  <text x="87.5" y="118" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" data-kolumn="plast" data-rad="2">Polypropen</text>
  <text x="225" y="118" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" data-kolumn="forkortning" data-rad="2">PP</text>
  <text x="335" y="118" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" data-kolumn="monomer" data-rad="2">propen</text>
  <text x="407" y="118" fill="#2d4a35"   font-family="Georgia, 'Times New Roman', serif" font-size="14" text-anchor="start" data-kolumn="anvands" data-rad="2">matförpackningar, plastlådor, rep, textilfibrer</text>
  <line x1="16" y1="134" x2="744" y2="134" stroke="#2d4a35" stroke-width="0.8" stroke-linecap="round" />
  <text x="87.5" y="162" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" data-kolumn="plast" data-rad="3">Polystyren</text>
  <text x="225" y="162" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" data-kolumn="forkortning" data-rad="3">PS</text>
  <text x="335" y="162" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" data-kolumn="monomer" data-rad="3">styren</text>
  <text x="407" y="162" fill="#2d4a35"   font-family="Georgia, 'Times New Roman', serif" font-size="14" text-anchor="start" data-kolumn="anvands" data-rad="3">engångsprodukter, isolering, skyddsförpackningar</text>
  <line x1="16" y1="178" x2="744" y2="178" stroke="#2d4a35" stroke-width="0.8" stroke-linecap="round" />
  <rect x="16" y="181" width="728" height="38" rx="4" fill="#5a9668" fill-opacity="0.10" stroke="none" data-markering="pvc"/>
  <line x1="19" y1="182" x2="19" y2="218" stroke="#5a9668" stroke-width="3" stroke-linecap="round" data-markering="pvc"/>
  <text x="87.5" y="206" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" data-kolumn="plast" data-rad="4">Polyvinylklorid</text>
  <text x="225" y="206" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" data-kolumn="forkortning" data-rad="4">PVC</text>
  <text x="335" y="206" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" data-kolumn="monomer" data-rad="4">vinylklorid</text>
  <text x="407" y="206" fill="#2d4a35"   font-family="Georgia, 'Times New Roman', serif" font-size="14" text-anchor="start" data-kolumn="anvands" data-rad="4">rör, golv, kabelisolering</text>
  <line x1="16" y1="222" x2="744" y2="222" stroke="#2d4a35" stroke-width="1.4" stroke-linecap="round" />
  <text x="30" y="248"    font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" fill="#5a9668" text-anchor="start" data-not="klor">PVC innehåller även klor.</text>
</svg>
