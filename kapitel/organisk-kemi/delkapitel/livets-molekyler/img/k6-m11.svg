<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t">
  <title id="t">Tre rader som visar hur kolhydrat, fett och protein bryts ner. De två första ger koldioxid och vatten. Proteinet innehåller dessutom kväve och ger därför också urea, som lämnar med urinen</title>
  <text x="60" y="85" fill="#2d4a35"   font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="bold" text-anchor="start" data-rad="1">kolhydrat</text>
  <circle cx="200" cy="80" r="12" fill="#3a3a3a" stroke="#2d4a35" stroke-width="1.2" data-atomslag="C" data-rad="1"/>
  <text x="200" y="85"   text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#fff" data-rad="1">C</text>
  <circle cx="234" cy="80" r="12" fill="#f5f0e4" stroke="#2d4a35" stroke-width="1.2" data-atomslag="H" data-rad="1"/>
  <text x="234" y="85"   text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#2d4a35" data-rad="1">H</text>
  <circle cx="268" cy="80" r="12" fill="#C0392B" stroke="#2d4a35" stroke-width="1.2" data-atomslag="O" data-rad="1"/>
  <text x="268" y="85"   text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#fff" data-rad="1">O</text>
