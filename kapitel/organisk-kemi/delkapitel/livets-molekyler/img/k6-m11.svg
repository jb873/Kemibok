  <polygon points="420,68 412,72 412,64" fill="#2d4a35" data-pil="co2" data-rad="1"/>
  <text x="432" y="73" fill="#2d4a35"   font-family="Georgia, 'Times New Roman', serif" font-size="16" text-anchor="start" data-rad="1"><tspan>C</tspan><tspan fill="#C0392B" data-o="1">O</tspan><tspan font-size="0.7em" dy="0.3em">2</tspan><tspan dy="-0.3em">​</tspan></text>
  <line x1="340" y1="92" x2="412" y2="92" stroke="#2d4a35" stroke-width="2" stroke-linecap="round" data-pil="h2o" data-rad="1"/>
  <polygon points="420,92 412,96 412,88" fill="#2d4a35" data-pil="h2o" data-rad="1"/>
  <text x="432" y="97" fill="#2d4a35"   font-family="Georgia, 'Times New Roman', serif" font-size="16" text-anchor="start" data-rad="1"><tspan>H</tspan><tspan font-size="0.7em" dy="0.3em">2</tspan><tspan dy="-0.3em" fill="#C0392B" data-o="1">O</tspan></text>
  <text x="60" y="185" fill="#2d4a35"   font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="bold" text-anchor="start" data-rad="2">fett</text>
  <circle cx="200" cy="180" r="12" fill="#3a3a3a" stroke="#2d4a35" stroke-width="1.2" data-atomslag="C" data-rad="2"/>
  <text x="200" y="185"   text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#fff" data-rad="2">C</text>
  <circle cx="234" cy="180" r="12" fill="#f5f0e4" stroke="#2d4a35" stroke-width="1.2" data-atomslag="H" data-rad="2"/>
