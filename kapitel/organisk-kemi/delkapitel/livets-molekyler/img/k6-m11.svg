  <circle cx="268" cy="280" r="12" fill="#C0392B" stroke="#2d4a35" stroke-width="1.2" data-atomslag="O" data-rad="3"/>
  <text x="268" y="285"   text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#fff" data-rad="3">O</text>
