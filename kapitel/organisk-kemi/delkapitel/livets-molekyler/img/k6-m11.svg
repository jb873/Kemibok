  <line x1="340" y1="292" x2="412" y2="292" stroke="#2d4a35" stroke-width="2" stroke-linecap="round" data-pil="h2o" data-rad="3"/>
  <polygon points="420,292 412,296 412,288" fill="#2d4a35" data-pil="h2o" data-rad="3"/>
  <text x="432" y="297" fill="#2d4a35"   font-family="Georgia, 'Times New Roman', serif" font-size="16" text-anchor="start" data-rad="3"><tspan>H</tspan><tspan font-size="0.7em" dy="0.3em">2</tspan><tspan dy="-0.3em" fill="#C0392B" data-o="1">O</tspan></text>
  <line x1="340" y1="320" x2="466.4" y2="320" stroke="#5a9668" stroke-width="3.4" stroke-linecap="round" data-pil="urea" data-rad="3"/>
  <polygon points="480,320 466.4,326.8 466.4,313.2" fill="#5a9668" data-pil="urea" data-rad="3"/>
  <text x="492" y="325" fill="#2d4a35"   font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="bold" text-anchor="start" data-rad="3">urea, <tspan>C</tspan><tspan fill="#C0392B" data-o="1">O</tspan><tspan>(</tspan><tspan fill="#3D6BA8" data-n="1">N</tspan><tspan>H</tspan><tspan font-size="0.7em" dy="0.3em">2</tspan><tspan dy="-0.3em">)</tspan><tspan font-size="0.7em" dy="0.3em">2</tspan><tspan dy="-0.3em">​</tspan></text>
  <text x="492" y="343" fill="#2d4a35"   font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic" text-anchor="start" data-rad="3">lämnar med urinen</text>
  <line x1="302" y1="292" x2="290" y2="330" stroke="#8A8A8A" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/>
  <text x="200" y="346" fill="#2d4a35"   font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic" text-anchor="start">kan varken bli koldioxid eller vatten</text>
  <text x="480" y="386" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="bold">kvävet behöver en egen väg ut</text>
