  <text x="60" y="285" fill="#2d4a35"   font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="bold" text-anchor="start" data-rad="3">protein</text>
  <circle cx="200" cy="280" r="12" fill="#3a3a3a" stroke="#2d4a35" stroke-width="1.2" data-atomslag="C" data-rad="3"/>
  <text x="200" y="285"   text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#fff" data-rad="3">C</text>
  <circle cx="234" cy="280" r="12" fill="#f5f0e4" stroke="#2d4a35" stroke-width="1.2" data-atomslag="H" data-rad="3"/>
