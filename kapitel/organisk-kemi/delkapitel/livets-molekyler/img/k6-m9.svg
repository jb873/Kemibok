<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="t">
  <title id="t">Tre steg. Först fem lösa aminosyror, sedan samma fem hopkopplade till en rak kedja, sist kedjan vikt till en tredimensionell form med streckade linjer som visar var den hålls ihop</title>
