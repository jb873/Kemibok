<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-labelledby="t">
  <title id="t">En aminosyra. I mitten en kolatom med fyra bindningar: en aminogrupp till vänster med blå kväveatom, en karboxylgrupp till höger med röda syreatomer, en sidokedja märkt R uppåt och en väteatom nedåt</title>
  <line x1="437" y1="200" x2="394" y2="200" stroke="#2d4a35" stroke-width="2.2" stroke-linecap="round" data-bind="C-N"   data-molekyl="aminosyra"/>
  <line x1="370.02" y1="193.04" x2="340.3" y2="174.22" stroke="#2d4a35" stroke-width="2.2" stroke-linecap="round" data-bind="N-H"   data-molekyl="aminosyra"/>
  <line x1="370.02" y1="206.96" x2="340.3" y2="225.78" stroke="#2d4a35" stroke-width="2.2" stroke-linecap="round" data-bind="N-H"   data-molekyl="aminosyra"/>
  <line x1="463" y1="200" x2="506" y2="200" stroke="#2d4a35" stroke-width="2.2" stroke-linecap="round" data-bind="C-C"   data-molekyl="aminosyra"/>
  <line x1="515.4" y1="187" x2="515.4" y2="162" stroke="#2d4a35" stroke-width="2.2" stroke-linecap="round" data-bind="C-O"   data-molekyl="aminosyra"/>
  <line x1="522.6" y1="187" x2="522.6" y2="162" stroke="#2d4a35" stroke-width="2.2" stroke-linecap="round" data-bind="C-O"   data-molekyl="aminosyra"/>
  <line x1="532" y1="200" x2="575" y2="200" stroke="#2d4a35" stroke-width="2.2" stroke-linecap="round" data-bind="C-O"   data-molekyl="aminosyra"/>
  <line x1="601" y1="200" x2="648" y2="200" stroke="#2d4a35" stroke-width="2.2" stroke-linecap="round" data-bind="O-H"   data-molekyl="aminosyra"/>
  <line x1="450" y1="213" x2="450" y2="242" stroke="#2d4a35" stroke-width="2.2" stroke-linecap="round" data-bind="C-H"   data-molekyl="aminosyra"/>
  <line x1="450" y1="187" x2="450" y2="162" stroke="#2d4a35" stroke-width="2.2" stroke-linecap="round" data-bind="C-R"   data-molekyl="aminosyra"/>
  <text x="450" y="208.65"   text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24.7" fill="#2d4a35" font-weight="bold" data-atom="C"  data-molekyl="aminosyra">C</text>
  <text x="381" y="208.65"   text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24.7" fill="#3D6BA8" font-weight="bold" data-atom="N"  data-molekyl="aminosyra">N</text>
  <text x="332.7" y="178.05"   text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21.241999999999997" fill="#2d4a35"  data-atom="H"  data-molekyl="aminosyra">H</text>
  <text x="332.7" y="239.25"   text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21.241999999999997" fill="#2d4a35"  data-atom="H"  data-molekyl="aminosyra">H</text>
  <text x="519" y="208.65"   text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24.7" fill="#2d4a35" font-weight="bold" data-atom="C"  data-molekyl="aminosyra">C</text>
  <text x="519" y="157.65"   text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24.7" fill="#C0392B" font-weight="bold" data-atom="O"  data-molekyl="aminosyra">O</text>
  <text x="588" y="208.65"   text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24.7" fill="#C0392B" font-weight="bold" data-atom="O"  data-molekyl="aminosyra">O</text>
  <text x="657" y="208.65"   text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21.241999999999997" fill="#2d4a35"  data-atom="H"  data-molekyl="aminosyra">H</text>
  <text x="450" y="259.65"   text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21.241999999999997" fill="#2d4a35"  data-atom="H"  data-molekyl="aminosyra">H</text>
  <rect x="428" y="130" width="44" height="38" fill="#5a9668" fill-opacity="0.18" rx="5" stroke="#5a9668" stroke-width="1.4" data-sidokedja="1"/>
  <text x="450" y="157.65"   text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24.7" fill="#5a9668" font-weight="bold" data-atom="R"  data-molekyl="aminosyra">R</text>
  <ellipse cx="363" cy="200" rx="62" ry="52" fill="none" stroke="#5a9668" stroke-width="1.4" data-ring="amino"/>
  <ellipse cx="581.1" cy="179.6" rx="96.6" ry="61.2" fill="none" stroke="#5a9668" stroke-width="1.4" data-ring="karboxyl"/>
  <text x="363" y="278" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="bold">aminogrupp –<tspan fill="#3D6BA8" data-n="1">N</tspan><tspan>H</tspan><tspan font-size="0.7em" dy="0.3em">2</tspan><tspan dy="-0.3em">​</tspan></text>
  <text x="363" y="296" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic">kan ta upp en vätejon – basisk</text>
  <text x="581.1" y="278" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="bold">karboxylgrupp –<tspan>C</tspan><tspan fill="#C0392B" data-o="1">OOH</tspan></text>
  <text x="581.1" y="296" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic">kan avge en vätejon – sur</text>
  <line x1="476" y1="145" x2="570" y2="105" stroke="#8A8A8A" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/>
  <text x="574" y="101" fill="#2d4a35"   font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic" text-anchor="start">sidokedja R – det enda som skiljer aminosyrorna åt</text>
  <text x="450" y="406" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic">alla tjugo aminosyror ser likadana ut – utom i rutan</text>
</svg>
