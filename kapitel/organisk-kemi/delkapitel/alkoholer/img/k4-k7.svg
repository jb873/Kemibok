<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t">
  <title id="t">En etanolmolekyl delad av en streckad linje. Till vänster kolvätedelen mot grått fält, till höger hydroxylgruppen mot blått fält, med vattenmolekyler som dras mot den</title>
  <rect x="80" y="60" width="239" height="180" fill="#8A8A8A" fill-opacity="0.18" rx="8" data-falt="kolvate"/>
  <rect x="319" y="60" width="260" height="180" fill="#a8c4d8" fill-opacity="0.3" rx="8" data-falt="hydroxyl"/>
  <line x1="319" y1="50" x2="319" y2="250" stroke="#2d4a35" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="6 4" data-skiljelinje="1"/>
  <line x1="263" y1="150" x2="283" y2="150" stroke="#2d4a35" stroke-width="2.2" stroke-linecap="round" data-bind="C-C"  data-molekyl="etanol"/>
  <line x1="250" y1="137" x2="250" y2="125" stroke="#2d4a35" stroke-width="2.2" stroke-linecap="round" data-bind="C-H"  data-molekyl="etanol"/>
  <line x1="250" y1="163" x2="250" y2="175" stroke="#2d4a35" stroke-width="2.2" stroke-linecap="round" data-bind="C-H"  data-molekyl="etanol"/>
  <line x1="237" y1="150" x2="213" y2="150" stroke="#2d4a35" stroke-width="2.2" stroke-linecap="round" data-bind="C-H"  data-molekyl="etanol"/>
  <line x1="296" y1="137" x2="296" y2="125" stroke="#2d4a35" stroke-width="2.2" stroke-linecap="round" data-bind="C-H"  data-molekyl="etanol"/>
  <line x1="296" y1="163" x2="296" y2="175" stroke="#2d4a35" stroke-width="2.2" stroke-linecap="round" data-bind="C-H"  data-molekyl="etanol"/>
  <line x1="309" y1="150" x2="329" y2="150" stroke="#2d4a35" stroke-width="2.2" stroke-linecap="round" data-bind="C-O"  data-molekyl="etanol"/>
  <line x1="355" y1="150" x2="379" y2="150" stroke="#2d4a35" stroke-width="2.2" stroke-linecap="round" data-bind="O-H"  data-molekyl="etanol"/>
  <text x="250" y="156.65"   text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#2d4a35" font-weight="bold" data-atom="C"  data-molekyl="etanol">C</text>
  <text x="296" y="156.65"   text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#2d4a35" font-weight="bold" data-atom="C"  data-molekyl="etanol">C</text>
  <text x="250" y="122.65"   text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16.34" fill="#2d4a35"  data-atom="H"  data-molekyl="etanol">H</text>
  <text x="250" y="190.65"   text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16.34" fill="#2d4a35"  data-atom="H"  data-molekyl="etanol">H</text>
  <text x="204" y="156.65"   text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16.34" fill="#2d4a35"  data-atom="H"  data-molekyl="etanol">H</text>
  <text x="296" y="122.65"   text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16.34" fill="#2d4a35"  data-atom="H"  data-molekyl="etanol">H</text>
  <text x="296" y="190.65"   text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16.34" fill="#2d4a35"  data-atom="H"  data-molekyl="etanol">H</text>
  <text x="342" y="156.65"   text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#C0392B" font-weight="bold" data-atom="O"  data-molekyl="etanol">O</text>
  <text x="388" y="156.65"   text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16.34" fill="#2d4a35"  data-atom="H"  data-molekyl="etanol">H</text>
  <path d="M428 72 L440 80 L452 72" fill="none" stroke="#a8c4d8" stroke-width="3.5" stroke-linecap="round" transform="rotate(200 440 80)" data-vatten="1"/>
  <line x1="440" y1="80" x2="360.4" y2="140" stroke="#a8c4d8" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/>
  <path d="M458 192 L470 200 L482 192" fill="none" stroke="#a8c4d8" stroke-width="3.5" stroke-linecap="round" transform="rotate(-30 470 200)" data-vatten="1"/>
  <line x1="470" y1="200" x2="360.4" y2="160" stroke="#a8c4d8" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/>
  <path d="M408 222 L420 230 L432 222" fill="none" stroke="#a8c4d8" stroke-width="3.5" stroke-linecap="round" transform="rotate(40 420 230)" data-vatten="1"/>
  <line x1="420" y1="230" x2="360.4" y2="160" stroke="#a8c4d8" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/>
  <text x="199.5" y="270" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="bold">kolvätedel</text>
  <text x="199.5" y="290" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic">löser fett och opolära ämnen</text>
  <text x="449" y="270" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="bold">hydroxylgrupp</text>
  <text x="449" y="290" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic">löser vatten och polära ämnen</text>
  <text x="380" y="318" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic">det är kombinationen som gör etanol till ett så bra lösningsmedel</text>
</svg>
