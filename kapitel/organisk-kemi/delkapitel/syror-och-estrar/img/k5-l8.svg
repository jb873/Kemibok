<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 370" width="860" height="370" role="img" aria-labelledby="t">
  <title id="t">En tabell med sex estrar, vad deras doft påminner om och var de finns naturligt</title>
  <rect x="40" y="30" width="780" height="40" fill="#5a9668" data-del="rubrikrad"/>
  <text x="54" y="56"    font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="bold" fill="#fff" text-anchor="start">Ester</text>
  <text x="314" y="56"    font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="bold" fill="#fff" text-anchor="start">Doften påminner om</text>
  <text x="554" y="56"    font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="bold" fill="#fff" text-anchor="start">Finns naturligt i</text>
  <line x1="40" y1="110" x2="820" y2="110" stroke="#2d4a35" stroke-width="0.8" stroke-linecap="round" />
  <text x="54" y="96" fill="#2d4a35"   font-family="Georgia, 'Times New Roman', serif" font-size="15" text-anchor="start" data-rad="1" data-kolumn="1">Etylformiat</text>
  <text x="314" y="96" fill="#2d4a35"   font-family="Georgia, 'Times New Roman', serif" font-size="15" text-anchor="start" data-rad="1" data-kolumn="2">rom</text>
  <text x="554" y="96" fill="#2d4a35"   font-family="Georgia, 'Times New Roman', serif" font-size="15" text-anchor="start" data-rad="1" data-kolumn="3">hallon</text>
  <line x1="40" y1="150" x2="820" y2="150" stroke="#2d4a35" stroke-width="0.8" stroke-linecap="round" />
  <text x="54" y="136" fill="#2d4a35"   font-family="Georgia, 'Times New Roman', serif" font-size="15" text-anchor="start" data-rad="2" data-kolumn="1">Pentylacetat</text>
  <text x="314" y="136" fill="#2d4a35"   font-family="Georgia, 'Times New Roman', serif" font-size="15" text-anchor="start" data-rad="2" data-kolumn="2">banan</text>
  <text x="554" y="136" fill="#2d4a35"   font-family="Georgia, 'Times New Roman', serif" font-size="15" text-anchor="start" data-rad="2" data-kolumn="3">banan</text>
  <line x1="40" y1="190" x2="820" y2="190" stroke="#2d4a35" stroke-width="0.8" stroke-linecap="round" />
  <text x="54" y="176" fill="#2d4a35"   font-family="Georgia, 'Times New Roman', serif" font-size="15" text-anchor="start" data-rad="3" data-kolumn="1">Propylacetat</text>
  <text x="314" y="176" fill="#2d4a35"   font-family="Georgia, 'Times New Roman', serif" font-size="15" text-anchor="start" data-rad="3" data-kolumn="2">päron</text>
  <text x="554" y="176" fill="#2d4a35"   font-family="Georgia, 'Times New Roman', serif" font-size="15" text-anchor="start" data-rad="3" data-kolumn="3">päron</text>
  <line x1="40" y1="230" x2="820" y2="230" stroke="#2d4a35" stroke-width="0.8" stroke-linecap="round" />
  <text x="54" y="216" fill="#2d4a35"   font-family="Georgia, 'Times New Roman', serif" font-size="15" text-anchor="start" data-rad="4" data-kolumn="1">Etylbutanoat</text>
  <text x="314" y="216" fill="#2d4a35"   font-family="Georgia, 'Times New Roman', serif" font-size="15" text-anchor="start" data-rad="4" data-kolumn="2">ananas</text>
  <text x="554" y="216" fill="#2d4a35"   font-family="Georgia, 'Times New Roman', serif" font-size="15" text-anchor="start" data-rad="4" data-kolumn="3">ananas</text>
  <line x1="40" y1="270" x2="820" y2="270" stroke="#2d4a35" stroke-width="0.8" stroke-linecap="round" />
  <text x="54" y="256" fill="#2d4a35"   font-family="Georgia, 'Times New Roman', serif" font-size="15" text-anchor="start" data-rad="5" data-kolumn="1">Oktylacetat</text>
  <text x="314" y="256" fill="#2d4a35"   font-family="Georgia, 'Times New Roman', serif" font-size="15" text-anchor="start" data-rad="5" data-kolumn="2">apelsin</text>
  <text x="554" y="256" fill="#2d4a35"   font-family="Georgia, 'Times New Roman', serif" font-size="15" text-anchor="start" data-rad="5" data-kolumn="3">apelsin</text>
  <line x1="40" y1="310" x2="820" y2="310" stroke="#2d4a35" stroke-width="0.8" stroke-linecap="round" />
  <text x="54" y="296" fill="#2d4a35"   font-family="Georgia, 'Times New Roman', serif" font-size="15" text-anchor="start" data-rad="6" data-kolumn="1">Metylsalicylat</text>
  <text x="314" y="296" fill="#2d4a35"   font-family="Georgia, 'Times New Roman', serif" font-size="15" text-anchor="start" data-rad="6" data-kolumn="2">vintergröna</text>
  <text x="554" y="296" fill="#2d4a35"   font-family="Georgia, 'Times New Roman', serif" font-size="15" text-anchor="start" data-rad="6" data-kolumn="3">björk, vissa salvor</text>
  <line x1="40" y1="30" x2="40" y2="310" stroke="#2d4a35" stroke-width="1" stroke-linecap="round" />
  <line x1="820" y1="30" x2="820" y2="310" stroke="#2d4a35" stroke-width="1" stroke-linecap="round" />
  <text x="430" y="346"   text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="bold" fill="#5a9668">en riktig frukt innehåller många estrar samtidigt</text>
</svg>
