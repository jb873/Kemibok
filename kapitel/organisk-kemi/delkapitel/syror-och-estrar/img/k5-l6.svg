<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t">
  <title id="t">Fem organiska syror ordnade efter kedjelängd, från myrsyra med en kolatom till stearinsyra med arton. Karboxylgruppen ser likadan ut i alla fem, medan kolkedjan blir allt längre</title>
