  <text x="738" y="156.65"   text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16.34" fill="#2d4a35"  data-atom="H"  data-molekyl="etansyra">H</text>
  <text x="670" y="112"    font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" fill="#C0392B" text-anchor="start">+ syre</text>
  <text x="196" y="262" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="bold" data-rad="etanol">1 syre, 6 väte</text>
  <text x="646" y="262" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="bold" data-rad="etansyra">2 syre, 4 väte</text>
  <text x="196" y="286" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15">etanol, <tspan>C</tspan><tspan font-size="0.7em" dy="0.3em">2</tspan><tspan dy="-0.3em">H</tspan><tspan font-size="0.7em" dy="0.3em">5</tspan><tspan dy="-0.3em" fill="#C0392B" data-o="1">OH</tspan></text>
  <text x="646" y="286" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15">etansyra (ättiksyra), <tspan>CH</tspan><tspan font-size="0.7em" dy="0.3em">3</tspan><tspan dy="-0.3em">C</tspan><tspan fill="#C0392B" data-o="1">OOH</tspan></text>
