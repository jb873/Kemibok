<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 670" width="800" height="670" role="img" aria-labelledby="t">
  <title id="t">Kolets kretslopp med två slingor. Den inre snabba slingan går mellan atmosfär, växter, djur och nedbrytare på år till årtionden. En yttre slinga går ner i berggrunden där kol, olja och naturgas finns, och tillbaka upp genom förbränning</title>
