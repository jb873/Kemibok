<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t">
  <title id="t">Till vänster en sluten ugn där stenkol hettas till 1000 grader utan luft, så att tjära och gaser drivs ut och koks blir kvar. Till höger en masugn där koks och järnmalm går in, luft blåses in nedtill, smält järn kommer ut i botten och koldioxid upptill</title>
  <rect x="60" y="130" width="200" height="180" rx="10" fill="#f5f0e4" stroke="#2d4a35" stroke-width="2.4" data-del="ugn"/>
  <rect x="80" y="220" width="160" height="70" rx="6" fill="#3a3a3a" data-del="stenkol"/>
  <text x="160" y="262"   text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#f5f0e4">stenkol</text>
  <text x="160" y="170" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="bold">1000 °C</text>
  <text x="160" y="192" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic">utan luft</text>
  <line x1="20" y1="250" x2="56" y2="250" stroke="#8A8A8A" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4" data-del="luftinlopp-stangt"/>
  <line x1="28" y1="238" x2="48" y2="262" stroke="#C0392B" stroke-width="3"/>
  <line x1="48" y1="238" x2="28" y2="262" stroke="#C0392B" stroke-width="3"/>
  <text x="38" y="280"   text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-style="italic" fill="#C0392B">ingen luft</text>
  <line x1="160" y1="128" x2="160" y2="72" stroke="#2d4a35" stroke-width="2.5" stroke-linecap="round" data-pil="gaser"/>
  <polygon points="160,62 165,72 155,72" fill="#2d4a35" data-pil="gaser"/>
  <text x="160" y="48" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="bold">tjära och gaser</text>
  <text x="160" y="30" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic">metan och koloxid</text>
  <line x1="262" y1="250" x2="324" y2="250" stroke="#5a9668" stroke-width="4" stroke-linecap="round" data-pil="koks"/>
  <polygon points="340,250 324,258 324,242" fill="#5a9668" data-pil="koks"/>
  <text x="300" y="238" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="bold">koks</text>
  <text x="160" y="340" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic">torrdestillation</text>
  <path d="M400 80 L500 80 L500 180 L530 260 L530 320 L370 320 L370 260 L400 180 Z" fill="#f5f0e4" stroke="#2d4a35" stroke-width="2.4" data-del="masugn"/>
  <rect x="380" y="270" width="140" height="44" fill="#e8c547" data-del="smalta"/>
  <line x1="450" y1="30" x2="450" y2="66" stroke="#2d4a35" stroke-width="2.5" stroke-linecap="round" data-pil="in-topp"/>
  <polygon points="450,76 445,66 455,66" fill="#2d4a35" data-pil="in-topp"/>
  <text x="470" y="34" fill="#2d4a35"   font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="bold" text-anchor="start">järnmalm och koks</text>
  <line x1="600" y1="290" x2="546" y2="290" stroke="#a8c4d8" stroke-width="3" stroke-linecap="round" data-del="luftinlopp"/>
  <polygon points="534,290 546,284 546,296" fill="#a8c4d8" data-del="luftinlopp"/>
  <text x="610" y="295" fill="#2d4a35"   font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="bold" text-anchor="start">luft</text>
  <line x1="450" y1="322" x2="450" y2="354" stroke="#e8c547" stroke-width="3.5" stroke-linecap="round" data-pil="jarn"/>
  <polygon points="450,368 443,354 457,354" fill="#e8c547" data-pil="jarn"/>
  <text x="450" y="388" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="bold">smält järn</text>
  <line x1="560" y1="110" x2="631.52" y2="65.3" stroke="#8A8A8A" stroke-width="2.5" stroke-linecap="round" data-pil="co2"/>
  <polygon points="640,60 634.17,69.54 628.87,61.06" fill="#8A8A8A" data-pil="co2"/>
  <text x="650" y="56" fill="#2d4a35"   font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="bold" text-anchor="start">koldioxid, CO<tspan font-size="0.7em" dy="0.3em">2</tspan></text>
  <line x1="500" y1="120" x2="560" y2="110" stroke="#8A8A8A" stroke-width="2.5" stroke-linecap="round" />
  <text x="450" y="340" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic">masugn</text>
</svg>
