<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-labelledby="t">
  <title id="t">En tabell med kvicksilver, bly, kadmium och arsenik, deras kemiska beteckningar och vilka bränslen de finns i. Bredvid visar en trappa hur halten ökar uppåt i näringskedjan</title>
