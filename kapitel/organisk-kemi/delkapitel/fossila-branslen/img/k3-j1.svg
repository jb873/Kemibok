<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-labelledby="t">
  <title id="t">Solstrålning passerar genom atmosfären och värmer jordytan. Jordytan sänder ut värmestrålning uppåt. En del av den tas upp av växthusgasmolekyler, som sedan sänder ut strålning åt alla håll – en del uppåt mot rymden och en del tillbaka mot jorden. Annan värmestrålning lämnar atmosfären utan att tas upp</title>
