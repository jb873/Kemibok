<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" width="720" height="620" role="img" aria-labelledby="t">
  <title id="t">Ett fraktioneringstorn i genomskärning. Råolja värms till 400 grader och leds in nedtill. Uppåt i tornet blir det kallare, och olika fraktioner tas ut på olika nivåer – gaser högst upp, sedan bensin, fotogen, diesel, smörjoljor, och asfalt i botten</title>
