<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t">
  <title id="t">Genomskärning av berggrund. Under ett tätt berglager ligger naturgas överst, olja i mitten och vatten underst. En detaljförstoring visar att oljan sitter i små hålrum mellan bergkorn</title>
