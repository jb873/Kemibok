<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t">
  <title id="t">Fyra steg i en trappa: torv, brunkol, stenkol och ett fjärde ännu mer förkolnat steg. För varje steg visas kolhalten som en stapel, och den ökar uppåt</title>
  <rect x="60" y="264" width="150" height="46" fill="#3a3a3a" fill-opacity="0.85" stroke="#2d4a35" stroke-width="1.4"  data-steg="1"/>
  <text x="135" y="190" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="bold" >torv</text>
  <rect x="80" y="214" width="80.5" height="14" fill="#5a9668" rx="3"  data-kolhalt="57.5"/>
  <text x="120.25" y="208" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" >55–60 %</text>
  <text x="135" y="242" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-style="italic">pågår nu</text>
  <rect x="220" y="218" width="150" height="92" fill="#3a3a3a" fill-opacity="0.73" stroke="#2d4a35" stroke-width="1.4"  data-steg="2"/>
  <text x="295" y="144" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="bold" >brunkol</text>
  <rect x="240" y="168" width="91" height="14" fill="#5a9668" rx="3"  data-kolhalt="65"/>
  <text x="285.5" y="162" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" >60–70 %</text>
  <text x="295" y="196" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-style="italic">2–65 milj. år</text>
  <rect x="380" y="172" width="150" height="138" fill="#3a3a3a" fill-opacity="0.61" stroke="#2d4a35" stroke-width="1.4"  data-steg="3"/>
  <text x="455" y="98" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="bold" >stenkol</text>
  <rect x="400" y="122" width="115.5" height="14" fill="#5a9668" rx="3"  data-kolhalt="82.5"/>
  <text x="457.75" y="116" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" >75–90 %</text>
  <text x="455" y="150" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-style="italic">300–350 milj. år</text>
  <rect x="540" y="126" width="150" height="184" fill="none" fill-opacity="0" stroke="#2d4a35" stroke-width="1.4" stroke-dasharray="5 4" data-steg="4"/>
  <text x="615" y="52"   text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" fill="#8A8A8A">ännu mer förkolnat</text>
  <rect x="560" y="76" width="128.8" height="14" fill="#8A8A8A" rx="3" fill-opacity="0.6" data-kolhalt="92"/>
  <text x="624.4" y="70"   text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#8A8A8A">över 90 %</text>
  <text x="615" y="104"   text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-style="italic" fill="#8A8A8A">(Fördjupning)</text>
  <line x1="50" y1="310" x2="720" y2="310" stroke="#2d4a35" stroke-width="1.4" stroke-linecap="round" />
  <line x1="60" y1="344" x2="692" y2="344" stroke="#2d4a35" stroke-width="2" stroke-linecap="round" />
  <polygon points="700,344 692,348 692,340" fill="#2d4a35" />
  <text x="380" y="340" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic">mer tryck, mer tid</text>
  <line x1="60" y1="386" x2="692" y2="386" stroke="#5a9668" stroke-width="2" stroke-linecap="round" />
  <polygon points="700,386 692,390 692,382" fill="#5a9668" />
  <text x="380" y="382" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic">mer kol, mindre vatten</text>
  <text x="64" y="24" fill="#2d4a35"   font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic" text-anchor="start">kolhalt (stapel) och ålder</text>
</svg>
