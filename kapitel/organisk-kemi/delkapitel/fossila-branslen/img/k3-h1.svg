<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-labelledby="t">
  <title id="t">Till vänster en rörledning över en havsbotten mellan två landmassor. Till höger en anläggning som kyler gasen till minus 162 grader, ett fartyg som fraktar den, och en mottagningsanläggning</title>
  <rect x="20" y="60" width="360" height="190" fill="#a8c4d8" rx="8" data-del="hav"/>
  <path d="M20 60 L120 60 Q140 120 100 170 Q80 220 20 250 Z" fill="#8A8A8A" data-del="land"/>
  <path d="M380 60 L280 60 Q270 130 300 180 Q330 230 380 250 Z" fill="#8A8A8A" data-del="land"/>
  <path d="M112 150 Q200 200 292 150" fill="none" stroke="#5a9668" stroke-width="5" stroke-linecap="round" data-del="rorledning"/>
  <text x="200" y="272" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="bold">rörledning</text>
  <text x="200" y="292" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic">går bara mellan två bestämda punkter</text>
  <line x1="400" y1="40" x2="400" y2="300" stroke="#2d4a35" stroke-width="1.2" stroke-linecap="round" />
  <rect x="420" y="60" width="360" height="190" fill="#a8c4d8" rx="8" data-del="hav2"/>
  <path d="M420 60 L500 60 L500 250 L420 250 Z" fill="#8A8A8A"/>
  <path d="M700 60 L780 60 L780 250 L700 250 Z" fill="#8A8A8A"/>
  <rect x="440" y="120" width="44" height="60" fill="#f5f0e4" stroke="#2d4a35" stroke-width="1.5" data-del="kylning"/>
  <path d="M448 120 V100 h8 V120 M468 120 V96 h8 V120" fill="#f5f0e4" stroke="#2d4a35" stroke-width="1.5"/>
  <line x1="462" y1="196" x2="462" y2="228.8" stroke="#2d4a35" stroke-width="1.8" stroke-linecap="round" />
  <polygon points="462,236 458.4,228.8 465.6,228.8" fill="#2d4a35" />
  <text x="462" y="254" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-style="italic">kylning till −162 °C</text>
  <path d="M540 190 L660 190 L645 212 L555 212 Z" fill="#2d4a35" data-del="fartyg"/>
  <rect x="566" y="170" width="70" height="20" rx="10" fill="#f5f0e4" stroke="#2d4a35" stroke-width="1.5"/>
  <line x1="500" y1="160" x2="529.53" y2="185.31" stroke="#8A8A8A" stroke-width="1.8" stroke-linecap="round" />
  <polygon points="535,190 527.19,188.05 531.88,182.58" fill="#8A8A8A" />
  <line x1="665" y1="190" x2="694.53" y2="164.69" stroke="#8A8A8A" stroke-width="1.8" stroke-linecap="round" />
  <polygon points="700,160 696.88,167.42 692.19,161.95" fill="#8A8A8A" />
  <rect x="716" y="120" width="44" height="60" fill="#f5f0e4" stroke="#2d4a35" stroke-width="1.5" data-del="mottagning"/>
  <circle cx="738" cy="110" r="14" fill="#f5f0e4" stroke="#2d4a35" stroke-width="1.5"/>
  <text x="600" y="272" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="bold">flytande naturgas</text>
  <text x="600" y="292" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic">kan gå vart som helst, men kostar mer</text>
  <text x="400" y="320" fill="#2d4a35"  text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic">en gas tar 600 gånger större plats än samma mängd vätska</text>
</svg>
